        // Fungsi Membantu Mengacak Senarai (Fisher-Yates Shuffle)
        const shuffleArray = (array) => {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        };

        function App() {
            const [step, setStep] = useState('onboarding'); 
            const [user, setUser] = useState({ name: "", fontSize: "normal", highContrast: false, voiceEnabled: true });

            const [disclaimerAccepted, setDisclaimerAccepted] = useState(false);
            
            // Mengambil set soalan rawak (5 soalan setiap sesi) daripada 50 master soalan
            const [activeExercises, setActiveExercises] = useState([]);
            const [currentExerciseIndex, setCurrentExerciseIndex] = useState(0);
            
            const [selectedOption, setSelectedOption] = useState(null); 
            const [feedback, setFeedback] = useState(null);
            
            const [isMemorizingPhase, setIsMemorizingPhase] = useState(true);
            const [countdown, setCountdown] = useState(60);
            const [isAudioFinished, setIsAudioFinished] = useState(false);
            
            const [stats, setStats] = useState({
                completedCount: 0,
                correctAnswersCount: 0,
                streak: 3,
                skills: { ingatan: 82, perancangan: 91, perhatian: 76, pengiraan: 74 }
            });

                { id: 1, title: "Kereta Pertama", content: "Kereta pertama saya ialah Proton Saga merah pada tahun 1985." },
                { id: 2, title: "Majlis Perkahwinan", content: "Perkahwinan saya diadakan pada bulan Julai 1982." }
            ]);
            const [newMemoryTitle, setNewMemoryTitle] = useState("");
            const [newMemoryContent, setNewMemoryContent] = useState("");

            // Fungsi Pembaca Suara Pintar dengan Callback Selepas Selesai
            const speakText = (text, onFinished) => {
                if (!user.voiceEnabled) {
                    if (onFinished) onFinished();
                    return;
                }
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 0.85;

                    const voices = window.speechSynthesis.getVoices();
                    const malayVoice = voices.find(v => v.lang.includes('ms') || v.lang.includes('id') || v.name.toLowerCase().includes('malay') || v.name.toLowerCase().includes('indonesia'));
                    
                    if (malayVoice) {
                        utterance.voice = malayVoice;
                        utterance.lang = malayVoice.lang;
                    } else {
                        utterance.lang = 'ms-MY';
                    }

                    utterance.onend = () => {
                        if (onFinished) onFinished();
                    };

                    utterance.onerror = () => {
                        if (onFinished) onFinished();
                    };

                    window.speechSynthesis.speak(utterance);
                } else {
                    if (onFinished) onFinished();
                }
            };

            useEffect(() => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.onvoiceschanged = () => {
                        window.speechSynthesis.getVoices();
                    };
                }
            }, []);

            // Mulakan latihan baharu dengan mengacak 5 soalan daripada master soalan
            const startNewSession = () => {
                const randomized = shuffleArray(MASTER_EXERCISES).slice(0, 5);
                setActiveExercises(randomized);
                setCurrentExerciseIndex(0);
                setStep('exercise');
            };

            // Setiap kali latihan bertukar, mulakan fasa mendengar audio arahan
            useEffect(() => {
                if (step === 'exercise' && activeExercises.length > 0) {
                    const currentEx = activeExercises[currentExerciseIndex];
                    if (currentEx) {
                        setIsMemorizingPhase(true);
                        setCountdown(60); 
                        setIsAudioFinished(false); 
                        setSelectedOption([]);
                        
                        speakText(currentEx.scenario + ". " + currentEx.instructions, () => {
                            setIsAudioFinished(true);
                        });
                    }
                }
            }, [currentExerciseIndex, step, activeExercises]);

            // Pemasa undur hanya berjalan jika fasa mengingati aktif, audio sudah habis, dan masa > 0
            useEffect(() => {
                let timer;
                if (step === 'exercise' && isMemorizingPhase && isAudioFinished && countdown > 0) {
                    timer = setTimeout(() => setCountdown(countdown - 1), 1000);
                } else if (step === 'exercise' && isMemorizingPhase && isAudioFinished && countdown === 0) {
                    setIsMemorizingPhase(false);
                    speakText(activeExercises[currentExerciseIndex].question);
                }
                return () => clearTimeout(timer);
            }, [isMemorizingPhase, isAudioFinished, countdown, step, activeExercises, currentExerciseIndex]);

            const handleOptionClick = (opt, isMulti) => {
                if (feedback !== null) return;
                
                if (isMulti) {
                    const currentSelected = Array.isArray(selectedOption) ? selectedOption : [];
                    if (currentSelected.includes(opt)) {
                        setSelectedOption(currentSelected.filter(item => item !== opt));
                    } else {
                        setSelectedOption([...currentSelected, opt]);
                    }
                } else {
                    setSelectedOption(opt);
                }
            };

            const handleAnswerSubmit = () => {
                if (feedback !== null) return;
                const currentEx = activeExercises[currentExerciseIndex];
                let isCorrect = false;

                if (Array.isArray(currentEx.correctAnswer)) {
                    const userAnswers = Array.isArray(selectedOption) ? selectedOption : [];
                    if (userAnswers.length === currentEx.correctAnswer.length) {
                        isCorrect = currentEx.correctAnswer.every(item => userAnswers.includes(item));
                    }
                } else {
                    isCorrect = (selectedOption === currentEx.correctAnswer);
                }

                setFeedback({
                    correct: isCorrect,
                    explanation: currentEx.explanation
                });

                setStats(prev => ({
                    ...prev,
                    completedCount: prev.completedCount + 1,
                    correctAnswersCount: isCorrect ? prev.correctAnswersCount + 1 : prev.correctAnswersCount
                }));
            };

            const nextExercise = () => {
                setSelectedOption(null);
                setFeedback(null);
                if (currentExerciseIndex < activeExercises.length - 1) {
                    setCurrentExerciseIndex(prev => prev + 1);
                } else {
                    setStep('home');
                    setCurrentExerciseIndex(0);
                }
            };

            if (step === 'onboarding') {
                const canProceed = tempName.trim().length > 0 && disclaimerAccepted;

                return (
                    <div className="max-w-xl mx-auto p-6 bg-white rounded-2xl shadow-lg my-auto border border-slate-200 m-4 space-y-6">
                        <div>
                            <h1 className="text-3xl font-bold text-blue-900 mb-2">Selamat Datang ke MindLife</h1>
                            <p className="text-lg text-slate-700">
                                Latih otak anda untuk kehidupan seharian melalui situasi realistik. Sila masukkan nama anda dan bersetuju untuk bermula.
                            </p>
                        </div>

                        <div className="space-y-2">
                            <label htmlFor="username" className="block text-lg font-bold text-slate-800">
                                Siapa nama anda?
                            </label>
                            <input 
                                type="text" 
                                id="username"
                                placeholder="Contoh: Ahmad / Aminah"
                                value={tempName}
                                onChange={(e) => setTempName(e.target.value)}
                                className="w-full p-4 border-2 border-slate-300 rounded-xl text-lg focus:border-blue-600 focus:outline-none"
                            />
                        </div>
                        
                        <div className="bg-amber-50 border-l-4 border-amber-500 p-4 text-sm text-amber-900 rounded-r-lg">
                            <p className="font-semibold mb-1">Nota Kesihatan Penting:</p>
                            MindLife menyediakan latihan kognitif untuk menyokong aktiviti mental dan penuaan sihat. Ia <strong>bukan</strong> peranti perubatan dan tidak mendiagnosis, mencegah, atau merawat demensia atau Alzheimer.
                        </div>

                        <div className="flex items-center space-x-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <input 
                                type="checkbox" 
                                id="disclaimer" 
                                checked={disclaimerAccepted} 
                                onChange={(e) => setDisclaimerAccepted(e.target.checked)}
                                className="w-7 h-7 text-blue-600 rounded cursor-pointer"
                            />
                            <label htmlFor="disclaimer" className="text-base text-slate-800 font-bold cursor-pointer">
                                Saya faham dan bersetuju dengan syarat di atas. (Wajib tanda untuk mula)
                            </label>
                        </div>

                        <button 
                            disabled={!canProceed}
                            onClick={() => {
                                if (!canProceed) return; 
                                setUser(prev => ({ ...prev, name: tempName.trim() }));
                                setStep('home'); 
                                speakText(`Selamat pagi ${tempName.trim()}. Sedia untuk senaman otak hari ini?`);
                            }}
                            className={`w-full py-4 text-xl font-bold rounded-xl shadow touch-target transition-all ${
                                canProceed ? 'bg-blue-600 text-white hover:bg-blue-700 cursor-pointer' : 'bg-slate-300 text-slate-400 cursor-not-allowed'
                            }`}
                        >
                            Mula Sekarang
                        </button>
                    </div>
                );
            }

            const accuracyPercentage = stats.completedCount > 0 
                ? Math.round((stats.correctAnswersCount / stats.completedCount) * 100) 
                : 84;

            const currentEx = activeExercises[currentExerciseIndex];
            const isMultiSelection = currentEx ? Array.isArray(currentEx.correctAnswer) : false;

            return (
                <div className="flex flex-col flex-1 max-w-2xl mx-auto w-full bg-white shadow-xl min-h-screen pb-24">
                    <header className="bg-blue-900 text-white p-5 flex justify-between items-center shadow-md">
                        <div>
                            <h1 className="text-2xl font-bold tracking-wide">MindLife</h1>
                            <p className="text-sm text-blue-200">Senaman Otak Harian</p>
                        </div>
                        <div className="text-right">
                            <span className="bg-blue-800 text-blue-100 px-3 py-1 rounded-full text-sm font-semibold">
                                🔥 {stats.streak} Hari Berterusan
                            </span>
                        </div>
                    </header>

                    <main className="flex-1 p-6">
                        {step === 'home' && (
                            <div className="space-y-6">
                                <div className="bg-blue-50 border border-blue-200 p-6 rounded-2xl">
                                    <h2 className="text-2xl font-bold text-blue-900 mb-2">Selamat pagi, {user.name}</h2>
                                    <p className="text-slate-700 text-lg mb-4">Set senaman otak harian baru dengan soalan rawak sudah bersedia.</p>
                                    <button 
                                        onClick={startNewSession}
                                        className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl text-xl shadow-lg touch-target flex items-center justify-center space-x-2 cursor-pointer"
                                    >
                                        <span>▶ Mula Senaman Hari Ini</span>
                                    </button>
                                </div>

                                <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm">
                                    <h3 className="text-xl font-bold text-slate-800 mb-4">Prestasi Kemahiran Anda</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <div className="flex justify-between font-semibold mb-1 text-slate-700">
                                                <span>Ingatan</span>
                                                <span>{stats.skills.ingatan}%</span>
                                            </div>
                                            <div className="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
                                                <div className="bg-blue-600 h-full rounded-full" style={{ width: `${stats.skills.ingatan}%` }}></div>
                                            </div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between font-semibold mb-1 text-slate-700">
                                                <span>Perancangan</span>
                                                <span>{stats.skills.perancangan}%</span>
                                            </div>
                                            <div className="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
                                                <div className="bg-emerald-600 h-full rounded-full" style={{ width: `${stats.skills.perancangan}%` }}></div>
                                            </div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between font-semibold mb-1 text-slate-700">
                                                <span>Perhatian</span>
                                                <span>{stats.skills.perhatian}%</span>
                                            </div>
                                            <div className="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
                                                <div className="bg-amber-600 h-full rounded-full" style={{ width: `${stats.skills.perhatian}%` }}></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {step === 'exercise' && currentEx && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center bg-slate-100 p-3 rounded-xl">
                                    <span className="font-bold text-slate-700">Latihan {currentExerciseIndex + 1} dari {activeExercises.length}</span>
                                    <span className="bg-blue-100 text-blue-800 px-3 py-1 rounded-lg text-sm font-bold">
                                        {currentEx.category}
                                    </span>
                                </div>

                                <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm space-y-4">
                                    <div className="flex justify-between items-start">
                                        <h3 className="text-2xl font-bold text-slate-900">{currentEx.title}</h3>
                                        <button 
                                            onClick={() => {
                                                if (isMemorizingPhase) {
                                                    speakText(currentEx.scenario + ". " + currentEx.instructions, () => setIsAudioFinished(true));
                                                } else {
                                                    speakText(currentEx.scenario + ". " + currentEx.question);
                                                }
                                            }}
                                            className="bg-blue-50 text-blue-700 px-4 py-2 rounded-lg font-bold text-sm border border-blue-200 touch-target flex items-center space-x-1 hover:bg-blue-100 cursor-pointer"
                                        >
                                            <span>🔊 Dengar Semula</span>
                                        </button>
                                    </div>

                                    <p className="text-slate-700 bg-slate-50 p-4 rounded-xl text-lg border-l-4 border-blue-500">
                                        {currentEx.scenario}
                                    </p>

                                    {/* FASA MENGINGAT (PEMASA BERMULA HANYA SELEPAS AUDIO SELESAI) */}
                                    {isMemorizingPhase ? (
                                        <div className="bg-blue-50 border-2 border-blue-300 p-6 rounded-2xl text-center space-y-4">
                                            <p className="text-xl font-bold text-blue-900">{currentEx.instructions}</p>
                                            
                                            <div className="text-2xl font-extrabold text-blue-600 bg-white inline-block px-4 py-2 rounded-xl shadow-sm">
                                                {!isAudioFinished ? (
                                                    <span className="text-amber-700 animate-pulse">🔊 Mendengar Arahan Audio...</span>
                                                ) : (
                                                    <span>⏳ Masa Mengingat: {countdown} Saat</span>
                                                )}
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
                                                {currentEx.data.items.map((item, idx) => (
                                                    <div key={idx} className="bg-white p-4 rounded-xl border-2 border-blue-400 font-bold text-lg text-blue-900 shadow">
                                                        📋 {item}
                                                    </div>
                                                ))}
                                            </div>
                                            <button 
                                                onClick={() => {
                                                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                                                    setIsMemorizingPhase(false);
                                                }}
                                                className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-lg mt-2 hover:bg-blue-700 shadow cursor-pointer"
                                            >
                                                Saya Dah Ingat, Teruskan ke Soalan →
                                            </button>
                                        </div>
                                    ) : (
                                        /* FASA SOALAN & PILIHAN */
                                        <div className="space-y-4">
                                            <p className="text-lg font-medium text-slate-800">
                                                {currentEx.question} {isMultiSelection && <span className="text-sm text-blue-600 font-bold block mt-1">(Pilih jawapan yang tepat berdasarkan maklumat di atas)</span>}
                                            </p>

                                            <div className="space-y-3 pt-2">
                                                {currentEx.options.map((opt, idx) => {
                                                    const isSelected = isMultiSelection 
                                                        ? (Array.isArray(selectedOption) && selectedOption.includes(opt))
                                                        : (selectedOption === opt);

                                                    return (
                                                        <button
                                                            key={idx}
                                                            disabled={feedback !== null}
                                                            onClick={() => handleOptionClick(opt, isMultiSelection)}
                                                            className={`w-full text-left p-4 rounded-xl text-lg font-medium border-2 transition-all touch-target flex justify-between items-center cursor-pointer ${
                                                                isSelected 
                                                                    ? 'border-blue-600 bg-blue-50 text-blue-900 font-bold shadow-sm' 
                                                                    : 'border-slate-200 bg-white hover:bg-slate-50 text-slate-800'
                                                            }`}
                                                        >
                                                            <span>{opt}</span>
                                                            {isMultiSelection && (
                                                                <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-sm border-2 font-bold ${isSelected ? 'bg-blue-600 text-white border-blue-600' : 'border-slate-300'}`}>
                                                                    {isSelected ? '✓' : ''}
                                                                </span>
                                                            )}
                                                        </button>
                                                    );
                                                })}
                                            </div>

                                            {feedback === null && (
                                                <button
                                                    disabled={isMultiSelection ? (!selectedOption || selectedOption.length === 0) : !selectedOption}
                                                    onClick={handleAnswerSubmit}
                                                    className={`w-full py-4 font-bold rounded-xl text-xl mt-4 touch-target transition-all shadow ${
                                                        (isMultiSelection ? (selectedOption && selectedOption.length > 0) : selectedOption)
                                                            ? 'bg-blue-600 text-white hover:bg-blue-700 cursor-pointer'
                                                            : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                                    }`}
                                                >
                                                    Hantar Jawapan
                                                </button>
                                            )}
                                        </div>
                                    )}

                                    {feedback && (
                                        <div className={`p-5 rounded-2xl space-y-3 ${feedback.correct ? 'bg-emerald-50 border border-emerald-300 text-emerald-900' : 'bg-amber-50 border border-amber-300 text-amber-900'}`}>
                                            <p className="text-xl font-bold">
                                                {feedback.correct ? "✨ Bagus sekali! Jawapan anda tepat." : "💡 Cuba lagi untuk latihan seterusnya."}
                                            </p>
                                            <p className="text-base">{feedback.explanation}</p>
                                            <button 
                                                onClick={nextExercise}
                                                className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-xl mt-4 touch-target hover:bg-blue-700 shadow cursor-pointer"
                                            >
                                                Seterusnya →
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {step === 'progress' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-slate-900">Prestasi Latihan Anda</h2>
                                <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm space-y-4">
                                    <div className="grid grid-cols-2 gap-4 text-center">
                                        <div className="bg-blue-50 p-4 rounded-xl">
                                            <p className="text-sm text-slate-600">Latihan Selesai</p>
                                            <p className="text-3xl font-bold text-blue-700">{stats.completedCount + 12}</p>
                                        </div>
                                        <div className="bg-emerald-50 p-4 rounded-xl">
                                            <p className="text-sm text-slate-600">Ketepatan Purata</p>
                                            <p className="text-3xl font-bold text-emerald-700">{accuracyPercentage}%</p>
                                        </div>
                                    </div>
                                    <p className="text-slate-600 text-sm italic mt-2">
                                        Nota: Skor ini adalah ukuran prestasi latihan harian anda untuk mengekalkan kecergasan mental.
                                    </p>
                                </div>
                            </div>
                        )}

                        {step === 'memories' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-slate-900">Kisah Hidup & Memori Peribadi</h2>
                                <p className="text-slate-600">Simpan memori peribadi anda untuk dijadikan latihan ingatan yang bermakna.</p>
                                
                                <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm space-y-4">
                                    <input 
                                        type="text" 
                                        placeholder="Tajuk Memori (Cth: Kereta Pertama)"
                                        value={newMemoryTitle}
                                        onChange={(e) => setNewMemoryTitle(e.target.value)}
                                        className="w-full p-4 border border-slate-300 rounded-xl text-lg"
                                    />
                                    <textarea 
                                        placeholder="Butiran Memori (Cth: Kereta pertama saya ialah...)"
                                        value={newMemoryContent}
                                        onChange={(e) => setNewMemoryContent(e.target.value)}
                                        className="w-full p-4 border border-slate-300 rounded-xl text-lg h-24"
                                    />
                                    <button 
                                        onClick={() => {
                                            if (newMemoryTitle.trim() && newMemoryContent.trim()) {
                                                setMemories([...memories, { id: Date.now(), title: newMemoryTitle, content: newMemoryContent }]);
                                                setNewMemoryTitle("");
                                                setNewMemoryContent("");
                                            }
                                        }}
                                        className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-lg touch-target hover:bg-blue-700 cursor-pointer"
                                    >
                                        Simpan Memori
                                    </button>
                                </div>

                                <div className="space-y-3">
                                    {memories.map(mem => (
                                        <div key={mem.id} className="bg-white border border-slate-200 p-5 rounded-xl shadow-sm">
                                            <h4 className="font-bold text-blue-900 text-lg">{mem.title}</h4>
                                            <p className="text-slate-700 mt-1">{mem.content}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {step === 'profile' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-slate-900">Tetapan & Kebolehampuan</h2>
                                <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm space-y-6">
                                    <div>
                                        <p className="text-slate-600 text-sm mb-1">Nama Pengguna Semasa:</p>
                                        <p className="text-xl font-bold text-blue-900">{user.name}</p>
                                    </div>
                                    <div className="flex justify-between items-center border-t pt-4">
                                        <span className="text-lg font-medium text-slate-800">Arahan Suara Audio (Bahasa Melayu)</span>
                                        <input 
                                            type="checkbox" 
                                            checked={user.voiceEnabled}
                                            onChange={(e) => setUser({...user, voiceEnabled: e.target.checked})}
                                            className="w-7 h-7 text-blue-600 rounded cursor-pointer"
                                        />
                                    </div>
                                    <div className="border-t pt-4">
                                        <p className="text-slate-600 text-sm mb-2">Mod Bahasa / Language:</p>
                                        <span className="bg-blue-100 text-blue-800 font-bold px-4 py-2 rounded-lg inline-block">Bahasa Malaysia (Aktif)</span>
                                    </div>
                                    <div className="border-t pt-4">
                                        <button 
                                            onClick={() => { setTempName(user.name); setStep('onboarding'); }}
                                            className="text-red-600 font-bold text-lg hover:underline cursor-pointer"
                                        >
                                            Tukar Nama / Keluar Akaun
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {step !== 'onboarding' && (
                        <nav className="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 max-w-2xl mx-auto flex justify-around p-3 shadow-lg z-50">
                            <button 
                                onClick={() => setStep('home')} 
                                className={`flex flex-col items-center p-2 rounded-xl touch-target cursor-pointer ${step === 'home' ? 'text-blue-600 font-bold' : 'text-slate-600'}`}
                            >
                                <span className="text-2xl">🏠</span>
                                <span className="text-sm">Utama</span>
                            </button>
                            <button 
                                onClick={startNewSession} 
                                className={`flex flex-col items-center p-2 rounded-xl touch-target cursor-pointer ${step === 'exercise' ? 'text-blue-600 font-bold' : 'text-slate-600'}`}
                            >
                                <span className="text-2xl">🧠</span>
                                <span className="text-sm">Latih</span>
                            </button>
                            <button 
                                onClick={() => setStep('progress')} 
                                className={`flex flex-col items-center p-2 rounded-xl touch-target cursor-pointer ${step === 'progress' ? 'text-blue-600 font-bold' : 'text-slate-600'}`}
                            >
                                <span className="text-2xl">📈</span>
                                <span className="text-sm">Kemajuan</span>
                            </button>
                            <button 
                                onClick={() => setStep('memories')} 
                                className={`flex flex-col items-center p-2 rounded-xl touch-target cursor-pointer ${step === 'memories' ? 'text-blue-600 font-bold' : 'text-slate-600'}`}
                            >
                                <span className="text-2xl">📖</span>
                                <span className="text-sm">Memori</span>
                            </button>
                            <button 
                                onClick={() => setStep('profile')} 
                                className={`flex flex-col items-center p-2 rounded-xl touch-target cursor-pointer ${step === 'profile' ? 'text-blue-600 font-bold' : 'text-slate-600'}`}
                            >
                                <span className="text-2xl">⚙️</span>
                                <span className="text-sm">Profil</span>
                            </button>
                        </nav>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
